name: CI

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  format:
    name: Formatting
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install formatting tool
        run: brew install swiftformat
      - name: Check formatting (all violations fail)
        run: ./Scripts/check.sh format

  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install lint tool
        run: brew install swiftlint
      - name: Check lint (warnings and errors fail)
        run: ./Scripts/check.sh lint

  build:
    name: Build (universal Release)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build-phase lint tool
        run: brew install swiftlint
      - name: Build universal Release app
        run: ./Scripts/check.sh build ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO

  # Tests build their own Debug app, so they do not depend on the Release build.
  test:
    name: Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build-phase lint tool
        run: brew install swiftlint
      - name: Test
        id: tests
        shell: bash
        timeout-minutes: 15
        run: |
          mkdir -p build
          ./Scripts/check.sh test -resultBundlePath build/TestResults.xcresult 2>&1 | tee build/test.log
      - name: Upload test results
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/TestResults.xcresult
            build/test.log
          if-no-files-found: ignore
